name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A maintainer deploy-force on main (no inputs); the deploy job re-checks the
  # ref, so a dispatch on any other branch does nothing.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the git-derived versionCode isn't truncated.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest ships the Android SDK; AGP auto-installs the compileSdk
      # minor platform on the first build.
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
      - name: Unit tests
        run: ./gradlew test
      - name: Lint
        run: ./gradlew lint
      - name: The Wear OS app can't be released yet
        # Its release build must fail until the maintainer renames the package and decides to
        # launch (TODO Phase 6, the release gate in wear/build.gradle.kts). This fails if anyone
        # removes the gate, and never passes -Pstopdash.wearRelease=approved.
        run: |
          if ./gradlew :wear:bundleRelease > wear-release.log 2>&1; then
            echo "::error::The Wear OS release build succeeded; its release gate is gone."
            exit 1
          fi
          grep -q "The Wear OS app isn't released yet" wear-release.log || {
            cat wear-release.log
            echo "::error::The Wear OS release build failed, but not at its release gate."
            exit 1
          }
      # The weekly dependency-update workflow trusts this script to decide when a
      # batch changes what the app legally declares, so its suite runs here —
      # dependency-free, under node --test, nothing to install.
      - name: Test the license inventory check
        run: node --test scripts/check-license-inventory.test.js
      # The open-source attribution (res/raw/aboutlibraries.json) is committed and only
      # regenerated on demand, so a dependency change could otherwise ship a stale list
      # that no build step catches (Codex). Regenerate here and fail on any diff.
      #
      # The policy audit sits BETWEEN the regenerate and the drift diff, on purpose: a
      # hand-added dependency's license is already in the freshly regenerated working-tree
      # file, but its stale committed copy would fail the diff first — and then the generic
      # "export drifted" failure is what a reader sees, not the copyleft one this exists to
      # catch. StopDash ships proprietary, so a copyleft or source-available license is
      # incompatible outright; the script's tier table and its tests are the policy
      # (scripts/check-license-inventory.mjs).
      - name: Check licenses export is up to date and policy-clean
        run: |
          ./gradlew :app:exportBundledLicenses --rerun
          node scripts/check-license-inventory.mjs --forbidden
          git diff --exit-code app/src/main/res/raw/aboutlibraries.json
      - name: Test the GitHub-release publisher
        # The only coverage `scripts/publish-github-release.sh` can get:
        # `deploy` is main-only, so the step that calls it never runs on a
        # pull request and a regression there would first surface after
        # reaching `main`. Drives the real script against a stubbed `gh` and a
        # throwaway git repository, pinning each recovery branch and — the
        # load-bearing part — that every path which uploads uploads before it
        # publishes, so a release never becomes visible without its bundle.
        # Needs only the checkout, so it runs before the Gradle work below.
        run: python3 scripts/publish_github_release_test.py
      - name: Test the release-notes deduplication
        # Same reason: the "Build release notes" step in `deploy` is main-only,
        # so a regression in it first surfaces as a wrong Play "What's new"
        # card. Extracts the whole subject-collection block from this file and
        # runs it against a throwaway git repository, rather than a retyped
        # copy — testing the helper in isolation would stay green if the loop
        # stopped calling it.
        run: python3 scripts/release_notes_dedup_test.py
      - name: Test the station index builder
        # The station-index workflow runs it too, but only when the builder changes; this keeps a
        # regression from waiting for the next refresh to surface.
        run: python3 scripts/build_station_index_test.py
      - name: Test the National Rail station code builder
        run: python3 scripts/build_crs_index_test.py
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  screenshot-tests:
    name: screenshot-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # Read-only: this job renders PR-controlled Gradle code and only uploads
    # an artifact. The commit-back moved to `sync-screenshots` below, which
    # runs nothing from the PR — that separation is the fix, not a hardened
    # version of committing from here (see the ci-commit-artifact repo's
    # README). A job running PR code must hold no repo-write credential.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Same-repo PRs check out the head *branch* (not refs/pull/N/merge)
          # so recorded drift is measured against the PNGs actually committed
          # on the branch `sync-screenshots` pushes back to; the `build` job
          # still runs these tests on the merge ref for pass/fail.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
        with:
          # PR-controlled code must not write the shared cache; only main
          # pushes do.
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Every screenshot class is on the allow-list
        # This job records against an explicit `--tests` allow-list, one step
        # per class, so a class nobody added a step for records NOTHING here —
        # it passes in `build`'s `./gradlew test` like any other unit test, its
        # captures are never written, and the drift check has nothing to
        # compare. AGENTS.md warns about exactly this; nothing enforced it.
        # Cheap enough to run before Gradle: a grep over the sources and this
        # file that fails the moment the two disagree.
        run: |
          # The allow-list is what THIS job's own steps actually run, scoped by
          # the job block rather than matched across the file, and fully
          # qualified on both sides (`app.stopdash.ui.X` and `app.stopdash.X`
          # are different classes to Gradle).
          allow=$(awk '
            /^  screenshot-tests:/ { in_job = 1; next }
            in_job && /^  [A-Za-z0-9_-]+:/ { in_job = 0 }
            in_job && $0 !~ /^[[:space:]]*#/ { print }
          ' .github/workflows/ci.yml \
            | grep -o -- '--tests "[A-Za-z0-9_.]*"' | sed 's/^--tests "//; s/"$//')
          # A scan that finds nothing must fail loudly, not vacuously pass:
          # renaming this job would otherwise empty the allow-list and report
          # every class as missing.
          if [ -z "$allow" ]; then
            echo "::error::No --tests entries found in the screenshot-tests job."
            echo "The allow-list scan found nothing — did the job get renamed?"
            exit 1
          fi
          missing=""
          for f in $(grep -rl 'class [A-Za-z0-9_]*ScreenshotTest' app/src/test wear/src/test); do
            pkg=$(sed -n 's/^package \([A-Za-z0-9_.]*\).*/\1/p' "$f" | head -1)
            for cls in $(sed -n 's/.*class \([A-Za-z0-9_]*ScreenshotTest\).*/\1/p' "$f"); do
              printf '%s\n' "$allow" | grep -qxF "$pkg.$cls" \
                || missing="$missing $pkg.$cls"
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::Screenshot classes with no recording step in ci.yml:$missing"
            echo "Add a 'Run … screenshot tests' step for each, or they record nothing."
            exit 1
          fi
      - name: Clear committed snapshots before recording
        # Recording only overwrites files the suites still produce; starting
        # from empty means a removed test surfaces as a deletion in the refresh
        # commit instead of a stale PNG living forever.
        run: |
          rm -rf app/src/test/snapshots/images
          mkdir -p app/src/test/snapshots/images
      # One step per screenshot class, the explicit allow-list the guard above
      # enforces. `build` already runs these for pass/fail; this job records
      # the PNGs that `sync-screenshots` commits back and `post-screenshot-diff`
      # embeds for review.
      - name: Run MainScreen screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.MainScreenScreenshotTest" -Proborazzi.test.record=true
      - name: Run LocationGate screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.LocationGateScreenshotTest" -Proborazzi.test.record=true
      - name: Run Widget screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.widget.WidgetScreenshotTest" -Proborazzi.test.record=true
      - name: Run Licenses screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.LicensesScreenshotTest" -Proborazzi.test.record=true
      - name: Run Settings screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.SettingsScreenScreenshotTest" -Proborazzi.test.record=true
      - name: Run BugReportConsentDialog screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.BugReportConsentDialogScreenshotTest" -Proborazzi.test.record=true
      - name: Run RouteDetailScreen screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.RouteDetailScreenScreenshotTest" -Proborazzi.test.record=true
      - name: Run StationSearch screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.StationSearchScreenshotTest" -Proborazzi.test.record=true
      - name: Run TripScreen screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.TripScreenScreenshotTest" -Proborazzi.test.record=true
      - name: Run OnTheWayScreen screenshot tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.stopdash.ui.OnTheWayScreenScreenshotTest" -Proborazzi.test.record=true
      # The watch's captures land in app/src/test/snapshots too (wear_*.png), so this one
      # pipeline records, diffs and commits them.
      - name: Run WatchHome screenshot tests
        run: ./gradlew :wear:testDebugUnitTest --tests "app.stopdash.wear.WatchHomeScreenshotTest" -Proborazzi.test.record=true
      - name: Run ComplicationPicker screenshot tests
        run: ./gradlew :wear:testDebugUnitTest --tests "app.stopdash.wear.ComplicationPickerScreenshotTest" -Proborazzi.test.record=true
      - name: Print failing test details
        if: failure()
        run: |
          shopt -s nullglob globstar
          for xml in app/build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
            fi
          done
      - name: Fail on screenshot drift when a refresh cannot be pushed
        # Fork PRs and pushes to main can't receive a refresh commit, so
        # recorded drift must fail the job loudly there instead of hiding in
        # the artifact under a green check. Same-repo PRs skip this — their
        # drift is pushed back by `sync-screenshots`.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [ -n "$(git status --porcelain -- app/src/test/snapshots/images)" ]; then
            git status --porcelain -- app/src/test/snapshots/images
            echo "::error::Recorded screenshots differ from the committed ones; re-record and commit them."
            exit 1
          fi
      - name: Upload Roborazzi screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: app/src/test/snapshots/images/
          # A job that died before any test ran still uploads an empty
          # directory, and that emptiness is itself the diagnosis. This is
          # also `sync-screenshots`' only input.
          if-no-files-found: ignore
      - name: Upload screenshot test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 1

  # Pushes any drift in `screenshot-tests`' regenerated snapshots back to a
  # same-repo PR branch. Delegated to mikelward/ci-commit-artifact's reusable
  # workflow rather than done inline in `screenshot-tests`, specifically so the
  # commit/push never shares a job with the PR's own Gradle code — see that
  # repo's README for the structural reasoning. The @main reference is
  # deliberate: a shared reusable workflow this fleet tracks, so a fix there
  # reaches every consumer's next run with no per-repo bump.
  #
  # NOTE: this needs CI_COMMIT_ARTIFACT_TOKEN in a `ci-commit-artifact`
  # environment, provisioned by `repo setup` only once a workflow on the
  # default branch actually calls mikelward/ci-commit-artifact. So on the PR
  # that first adds this job it has no token and fails — deliberately kept OUT
  # of the required `lanes` gate below so that failure doesn't block the merge.
  # Re-run `repo setup` after this lands on main to provision the token; the
  # next UI PR's refresh then succeeds.
  sync-screenshots:
    name: sync-screenshots
    needs: [classify, screenshot-tests]
    # Same-repo PRs only — fork branches aren't pushable with this token, and
    # pushing to main from CI is not this job's purpose. The bare `needs:`
    # already implies success(), so this also skips on a docs-only PR (where
    # screenshot-tests is skipped).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: mikelward/ci-commit-artifact/.github/workflows/commit-artifact.yml@main
    # All three are required by GitHub's static check at call time: the called
    # workflow's commit job declares contents/pull-requests/actions write, and
    # GitHub refuses to start a run whose caller grants less than the callee
    # requests. pull-requests: write is dead weight here (comment-marker stays
    # unset and post-screenshot-diff posts the comment), kept only because the
    # platform demands it.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      artifact-name: roborazzi-screenshots
      dest-path: app/src/test/snapshots/images
      commit-message: 'ci: refresh recorded screenshots'
      branch-ref: ${{ github.event.pull_request.head.ref }}
      # The tested SHA, not the branch name: the artifact was rendered against
      # this commit, and expected-head-sha lets the hub tell a genuine lost
      # race (branch advanced since) apart from an ordinary no-op.
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      # comment-marker stays unset: this repo posts its own richer visual diff
      # (post-screenshot-diff below), not the hub's plain status line.
    # `inherit`, not a `secrets:` block: the called workflow's commit job reads
    # CI_COMMIT_ARTIFACT_TOKEN from this repository's `ci-commit-artifact`
    # environment, and an environment secret reaches a called workflow no other
    # way. The corresponding zizmor finding is excused inline; .github/zizmor.yml
    # carries the matching ref-pin policy for the reusable workflow.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # Embeds every snapshot this PR adds or changes, pinned to commit SHAs, into
  # a single auto-updated PR comment (marker: <!-- screenshot-diff -->) so
  # reviewers see the visual delta inline without downloading the artifact. Its
  # own job because a reusable-workflow job (`sync-screenshots`) can't carry
  # extra steps, and because posting a comment needs a pull-requests: write
  # token that must stay away from the render job.
  post-screenshot-diff:
    name: post-screenshot-diff
    runs-on: ubuntu-latest
    needs: [sync-screenshots]
    # Same-repo-PR-ness is already implied: sync-screenshots only reaches
    # success (rather than being skipped) on that path.
    if: needs.sync-screenshots.result == 'success'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The diff script runs `git merge-base HEAD origin/<base>`, and the
          # default shallow clone fetches no base branch — without this the
          # call fails before a comment can post.
          fetch-depth: 0
          # The hub workflow's own authoritative result — the resulting head of
          # branch-ref after it ran, whether or not it actually pushed — never a
          # commit made locally in this job.
          ref: ${{ needs.sync-screenshots.outputs.commit-sha }}
          persist-credentials: false
      - name: Post screenshot diffs as a PR comment
        # Convenience comment with before/after embeds pinned to commit SHAs;
        # never gates the job. Embeds go through github.com/<repo>/raw/<sha>/…
        # rather than raw.githubusercontent.com: that CDN origin never sees a
        # github.com session cookie, so every embed 404s once the repo is
        # private. The github.com path authorizes the viewer and redirects.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")
          HEAD_SHA=$(git rev-parse HEAD)
          mapfile -t entries < <(git diff --name-status "$BASE_SHA" HEAD -- app/src/test/snapshots/images/ | grep -E '^[AM]' || true)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "No added or changed screenshots vs merge-base."
            # A push may have reverted an earlier visual change, leaving a stale
            # diff comment from a prior run showing images from an obsolete
            # revision. Delete any marked comment so the thread matches reality.
            # --paginate so the marker isn't missed past 100 comments; the `if`
            # guards a listing failure (skip rather than guess), and an empty
            # id list makes the loop a no-op.
            if ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select((.body // "") | startswith("<!-- screenshot-diff -->")) | .id'); then
              for cid in $ids; do
                if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" > /dev/null; then
                  echo "Deleted stale screenshot-diff comment ${cid}."
                else
                  echo "::warning::Could not delete stale screenshot-diff comment ${cid}."
                fi
              done
            else
              echo "::warning::Could not list PR comments to clear a stale screenshot-diff comment."
            fi
            exit 0
          fi
          raw="https://github.com/${GITHUB_REPOSITORY}/raw"
          files="https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}/files"
          body="<!-- screenshot-diff -->"$'\n'"## Screenshot diffs"$'\n\n'"Auto-posted by CI. Images pinned to \`${HEAD_SHA:0:7}\`; each caption opens the diff."$'\n'
          count=0
          for entry in "${entries[@]}"; do
            status="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            name=$(basename "$path")
            # GitHub anchors a file in the Files changed tab by the sha256 of its path.
            anchor=$(printf '%s' "$path" | sha256sum | cut -d' ' -f1)
            count=$((count+1))
            if [ "$count" -gt 20 ]; then
              body+=$'\n'"_…truncated: more than 20 added/changed screenshots._"
              break
            fi
            if [ "$status" = "A" ]; then
              body+=$'\n'"**Added — [\`${name}\`](${files}#diff-${anchor})**"$'\n\n'"<img src=\"${raw}/${HEAD_SHA}/${path}\" width=\"320\">"$'\n'
            else
              body+=$'\n'"**Changed — [\`${name}\`](${files}#diff-${anchor})**"$'\n\n'"| Before | After |"$'\n'"| --- | --- |"$'\n'"| <img src=\"${raw}/${BASE_SHA}/${path}\" width=\"320\"> | <img src=\"${raw}/${HEAD_SHA}/${path}\" width=\"320\"> |"$'\n'
            fi
          done
          # `gh api` exits non-zero on an HTTP error AND on a body jq can't
          # parse; either way the answer is skip, not guess, so a swallowed
          # error can't post a duplicate. --paginate so the marker isn't lost
          # off page one past 100 comments.
          if ! ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select((.body // "") | startswith("<!-- screenshot-diff -->")) | .id'); then
            echo "::warning::Could not list PR comments; skipping the screenshot-diff comment rather than risking a duplicate. The snapshots are in the roborazzi-screenshots artifact."
            exit 0
          fi
          existing="${ids%%$'\n'*}"
          if [ -n "$existing" ]; then
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$body" > /dev/null; then
              echo "Updated screenshot-diff comment ${existing}."
            else
              echo "::warning::Could not update screenshot-diff comment ${existing}; the snapshots are in the roborazzi-screenshots artifact."
            fi
          else
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body" > /dev/null; then
              echo "Posted new screenshot-diff comment."
            else
              echo "::warning::Could not post the screenshot-diff comment; the snapshots are in the roborazzi-screenshots artifact."
            fi
          fi

  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, build, screenshot-tests, release-apk]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          # `release=` massages the release-apk skip on main into success only
          # when build succeeded, so the justified skip (a main push, where
          # `deploy`/`release-build` run R8 in release-apk's place) reads green
          # rather than as a gate failure. On a PR release-apk actually runs, so
          # its own result flows through.
          results: build=${{ needs.build.result }} screenshot-tests=${{ needs.screenshot-tests.result }} release=${{ (needs.release-apk.result == 'skipped' && needs.build.result == 'success') && 'success' || needs.release-apk.result }}

  release-apk:
    name: Build the release APK
    # The pull request lane's R8 smoke test: the only thing outside `deploy`
    # that exercises shrinking, optimization and obfuscation together, which is
    # what the Play build ships. Without it a release-only R8 failure -- a keep
    # rule that misses a reflective lookup, an optimizer crash -- passes every
    # required check and surfaces after merge, when `release-build`'s
    # bundleRelease is the first thing to run it.
    #
    # This was a step inside `build`, in series with the unit tests and lint,
    # which put its full ~6 min on the critical path for work that depends on
    # nothing those steps produce and produces nothing they consume. Split out
    # for the same reason `release-build` was split out of `deploy`, and the
    # two now sit side by side.
    #
    # What main gives up by skipping it is one task: optimizeReleaseResources,
    # which bundleRelease does not pull in (verified by --dry-run, not assumed).
    # It is the APK resource path; the AAB handles resources its own way.
    # Deliberate -- not what ships on main, and the pull request for the same
    # commit already ran it.
    #
    # The condition is `deploy`'s, inverted, exactly as it was on the step: skip
    # only where `deploy` is guaranteed to build a release variant in this run's
    # place. That guarantee comes from deploy's "Require a release keystore"
    # step -- with the secret present it builds the AAB, and without it the run
    # fails outright, so a green main push always ran R8 somewhere. Forks get no
    # such guarantee (they are exempt from that step and deploy's build steps
    # skip on their own conditions), so they keep building the release APK here.
    #
    # Fork status rather than the keystore secret, deliberately: this job
    # declares no `environment`, so whether it could see that secret at all
    # depends on where the secret is scoped -- gating on it would then work or
    # silently stop working depending on that scope. Fork status comes from the
    # `github` context and holds either way.
    #
    # `docs_only` is checked here rather than inherited: `needs: classify` alone
    # would build a release APK for a documentation-only diff.
    if: |
      !(github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.event.repository.fork != true) &&
      needs.classify.outputs.docs_only != 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: read only, and no `environment:` -- this job runs the pull
    # request's own Gradle code, so it must hold nothing a poisoned build script
    # could reach. See the note on `build`'s permissions block.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history, as the `build` checkout this was extracted from has:
          # app/build.gradle.kts derives versionCode from
          # `git rev-list --count HEAD`, so a shallow clone would build every
          # pull request APK as version 1 and hand R8 different
          # BuildConfig.VERSION_CODE/VERSION_NAME constants than the release
          # this exists to smoke-test.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
        with:
          # A malicious PR commit can poison its own branch's cache; lock PRs
          # to read-only so only main pushes write the shared cache.
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Build release APK (runs the full R8 pipeline)
        # Unsigned: the release signingConfig is only attached when the
        # RELEASE_KEYSTORE_* variables are set, which `release-build` does and
        # this job does not. Build-time only; runtime reflection still needs a
        # device check.
        # Scoped to the phone app: the Wear OS app's release is gated (below).
        run: ./gradlew :app:assembleRelease

  release-build:
    name: Build the release AAB
    # The signed AAB, built in parallel with `build` and `screenshot-tests`
    # rather than after them.
    #
    # This used to be a run of steps inside `deploy`, which needs both of those
    # jobs — so on every push to main the release compile and R8 started only
    # once the slower of them had finished, adding its full ~6 min to the
    # critical path for work that depends on nothing they produce. Splitting the
    # build from the publish lets it overlap them; `deploy` still needs both, so
    # nothing reaches Play until the tests and screenshots are green.
    #
    # Gated as `deploy` is — main-only by `if:`, `environment: production`
    # because the upload keystore lives there — plus `docs_only`, which `deploy`
    # gets transitively from its `needs:` and this job would otherwise miss: a
    # docs-only push would build and sign an AAB that nothing then publishes.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.classify.outputs.docs_only != 'true'
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HAS_RELEASE_KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    outputs:
      # Whether a signed AAB was actually produced. `deploy` gates its publish
      # steps on this: they used to read `env.RELEASE_KEYSTORE_FILE`, which the
      # keystore decode writes into *this* job's environment and cannot cross a
      # job boundary — left as-is, every publish step would have silently
      # skipped, which is exactly the failure `Require a release keystore`
      # below exists to make impossible.
      signed: ${{ steps.bundle.outputs.signed }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # This job never pushes; "Build release notes" reads git history
          # locally and talks to the GitHub API via its own GH_TOKEN env, not
          # a persisted credential.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5

      - name: Require a release keystore
        # A push to main must end in a signed AAB. Without the keystore secret
        # every step below skips on its own condition and the job goes green
        # having built and published nothing -- indistinguishable, from the
        # outside, from a release that worked. Fail here instead, naming what
        # is missing, so a secret that was renamed, expired, or lost in a move
        # to the `production` environment is caught on the push that broke it
        # rather than the next time someone looks for a build that never came.
        #
        # Forks are exempt. They have no secrets by design, and building
        # unsigned is a supported state here -- failing their main pushes would
        # turn that into a red build. The `release-apk` job keeps its release
        # compile in exactly that case, so R8 still runs for them.
        if: env.HAS_RELEASE_KEYSTORE_SECRET != 'true' && github.event.repository.fork != true
        run: |
          echo "::error::A push to main must produce a signed AAB, but RELEASE_KEYSTORE_BASE64 is unset or empty. Set it together with RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD, or this release would publish nothing."
          exit 1

      - name: Materialize release keystore
        # Decoded whenever the keystore secret is present, independent of
        # the Play upload secret. This lets the keystore secrets land first
        # so the signed AAB can be downloaded from CI artifacts for the
        # one-time manual seed upload Play Console requires, with
        # PLAY_SERVICE_ACCOUNT_JSON added later to enable the automated
        # upload. See dev-docs/play-store-internal-track.md.
        if: env.HAS_RELEASE_KEYSTORE_SECRET == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_PASSWORD" ]      && missing="$missing RELEASE_KEY_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ]         && missing="$missing RELEASE_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is set but these companion secrets are missing or empty:$missing"
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          if ! keytool -list -keystore "${RUNNER_TEMP}/release.keystore" -storepass "$RELEASE_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded release keystore is not a valid keystore or RELEASE_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"

      - name: Materialize google-services.json
        # Activates the google-services + crashlytics plugins (app/build.gradle.kts) so the
        # released AAB carries Firebase — still collecting nothing until the user opts in
        # (SPEC *Privacy*). Skipped when the secret isn't set: the build still finishes, with
        # Firebase dormant (dev-docs/firebase.md).
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          # Fail here on a wrong-file or truncated paste, not as a plugin parse error later.
          if ! grep -q '"project_info"' app/google-services.json || \
             ! grep -q '"client"'       app/google-services.json; then
            echo "::error::GOOGLE_SERVICES_JSON is missing project_info / client keys — not a valid Firebase config JSON, or the paste was truncated."
            exit 1
          fi

      - name: Build release AAB
        # Gated only on the keystore being present — a signed AAB is useful
        # on its own (downloadable artifact for the seed upload, before the
        # Play service account exists). The release signingConfig only
        # attaches when all four RELEASE_KEYSTORE_* / RELEASE_KEY_* variables
        # are set (see app/build.gradle.kts), which the decode step above
        # guarantees whenever it sets RELEASE_KEYSTORE_FILE — it fails first if
        # any of the other three is empty. Without them Play would reject the
        # AAB anyway.
        id: bundle
        if: env.RELEASE_KEYSTORE_FILE != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # Only the phone app: the Wear OS app isn't released yet (TODO Phase 6).
          ./gradlew :app:bundleRelease
          # Read by `deploy` as needs.release-build.outputs.signed. Set
          # after the build, so it means "a signed AAB exists" rather
          # than "the keystore decoded".
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed AAB as workflow artifact
        # Downloadable from the Actions UI for the one-time manual seed
        # upload to Play Console, and for re-uploading a release by hand.
        if: env.RELEASE_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30


  deploy:
    name: Distribute and release
    # Production deployment job. Gated three ways:
    #   1. `if:` — only a push to main or a manual workflow_dispatch that
    #      targets main (the dispatch UI defaults to main but can pick any
    #      ref, so `github.ref` is re-checked) — never on PRs.
    #   2. `environment: production` — the secrets used here live in the
    #      `production` environment. Configure it in repo Settings →
    #      Environments → production and restrict deployment branches to
    #      `main`, so the boundary is enforced by GitHub rather than only by
    #      the `if:` above.
    #   3. `needs:` — runs only after build and screenshot-tests both pass,
    #      so a failing test or screenshot on main blocks the release.
    #      `release-build` joins them because this job publishes its artifact;
    #      it builds in parallel with them, and this `needs:` is what keeps an
    #      untested build from reaching Play.
    #
    # The Play secret is optional: its steps gate on the presence flags below
    # and skip quietly when it isn't configured, so a repo with a keystore but
    # no Play credentials still gets a green run that builds and archives the
    # AAB without uploading it.
    #
    # The keystore is not optional here any more. A fork without it still skips
    # quietly, but on this repo a push to `main` that cannot produce a signed
    # AAB fails in `Require a release keystore` below: every step gating on its
    # own presence meant a release that silently never happened reported
    # success, which is indistinguishable from one that worked.
    # Serializes every run of THIS job across the repo — the only concurrency
    # this workflow declares (there is no workflow-level group; each push runs
    # independently). Without it, two pushes to main landing back to back could
    # both reach "Build release notes" before either's Play upload finished, so
    # both compute their range base from the same "nothing has published yet"
    # snapshot: worst case the newer upload lands first and Play rejects the
    # older push's now-lower versionCode; even in the right order, the newer
    # release's notes repeat subjects the older one already published.
    # `cancel-in-progress: false` queues the second run rather than canceling
    # the first — canceling mid-upload is the one thing this must never do. It
    # holds one pending slot, so a third back-to-back push can still evict a
    # queued deploy; that only defers those commits to the next release (the
    # notes range measures from the last run that published), never a bad
    # upload.
    concurrency:
      group: deploy-main-release
      cancel-in-progress: false
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, screenshot-tests, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      # Secret *presence* flags, evaluated at job level. A step's `if:`
      # cannot read a variable defined in that same step's `env:` block, so
      # the gates below evaluate these job-level booleans; the secret values
      # stay scoped to the steps that actually use them.
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    permissions:
      # Write, not read, for "Publish a GitHub release" below: it creates
      # the release and the tag that carries it. Nothing else in this job
      # writes to the repository, and the checkout below still discards its
      # credentials.
      contents: write
      # Used by "Build release notes" to walk recent main runs of this
      # workflow and find the last one that actually published.
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # This job never pushes; "Build release notes" reads git history
          # locally and talks to the GitHub API via its own GH_TOKEN env, not
          # a persisted credential.
          persist-credentials: false

      - name: Build release notes
        # Walks every release-worthy commit still queued for release
        # oldest-first — the range runs from the last run that actually
        # published, so it can span several pushes (see the range-base walk
        # below) — and collects the subject of each one worth shipping as a
        # release note to the Play internal track ("What's new"):
        #   - skip commits whose subject starts with a non-user-facing
        #     prefix (`ci:` / `docs:` / `internal:` / `refactor:` /
        #     `test:` / `tests:`);
        #   - skip commits whose every changed path is repo housekeeping —
        #     a `.md` file or any dotfile / dotdir at the repo root.
        #     `docs/PRIVACY.md` is ordinary docs here too: Play's "What's
        #     new" is a store-listing field a user installing an update
        #     never sees, so a wording-only policy change shipping a
        #     bullet bought no real visibility.
        # Qualifying subjects are emitted as a "• "-bulleted list,
        # oldest-first — always bulleted, even for one commit. If no commit
        # qualifies, RELEASE_NOTES_SKIP=true makes the Play steps below
        # skip, so housekeeping-only pushes don't ship a redundant release.
        #
        # A manual workflow_dispatch is the exception — it's an explicit
        # "publish the current tip anyway" request, so it falls back to a
        # generic note instead of skipping.
        #
        # The range base is the head SHA of the most recent main run of
        # this workflow that actually *published* — queried from the
        # Actions API (ported from Type Launcher / clothescast).
        # `github.event.before` is only a fallback: if a prior main push
        # failed before distributing, `before` would be that failed
        # push's tip and this run's notes would silently omit the
        # unreleased commits from the failed range. "Published" means the
        # Play upload *step* concluded success, not merely a green deploy
        # job: with publication secrets missing every publish step
        # skips and the deploy still concludes success, and counting such
        # a run as released would drop its range's commits from the first
        # real release after the secrets are fixed. This also gives a
        # manual workflow_dispatch a real range — it has no
        # `github.event.before`, so it previously only ever considered
        # the single HEAD commit.
        #
        # Play's per-language cap is 500 Unicode characters for the entered
        # "What's new" text; the truncation budget measures the full
        # formatted output — "• " bullets, newline separators, and the
        # "\n…" truncation marker all count. On overflow, trailing subjects
        # drop (oldest-first preserved at the head) and "\n…" is appended.
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Walk recent main runs of this workflow (newest first) and take
          # as the range base the head SHA of the first one whose deploy
          # job succeeded AND actually published — i.e. its Play upload
          # *step* concluded success, not just the job. A
          # deploy concludes green while publishing nothing whenever its
          # publication secrets are missing (every step skips), and also
          # when RELEASE_NOTES_SKIP suppressed a housekeeping-only push;
          # treating such a run as "released" would permanently drop its
          # range's commits from the next real release's notes. Skipped
          # housekeeping runs are fine to re-walk: their commits re-enter
          # the range and the prefix/path filter drops them again. The job
          # and step names below must match the `name:` values in this
          # workflow verbatim; rename them together. The current run and
          # re-runs of the same head SHA are skipped. "Published" is keyed on
          # a successful Play upload step specifically because these notes are
          # Play's `whatsnew-en-US`: any run that did not put its commits in
          # front of a Play reader must not become the base, or those commits
          # drop from Play's record for good. Requiring a Play upload can only
          # repeat a bullet instead — the trade this pipeline prefers.
          # How many 100-run pages of main history to search for the last
          # publication before giving up (see the note after the walk).
          MAX_RUN_PAGES=5

          # `saw_run` and `oldest_run_head` separate "the query worked but
          # nothing in the window ever published" from "the query returned
          # nothing at all" — the two need different bases (see below).
          # The list is newest-first, so the last head assigned before the
          # walk ends is the oldest run we examined.
          prev_sha=""
          oldest_run_head=""
          saw_run=false
          hit_page_cap=false
          page=1
          while :; do
            # Fail closed if the query itself fails, distinct from a
            # successful query that returns nothing. `|| true` here would turn
            # an API error into an empty page, read as "no prior runs", falling
            # back to BEFORE_SHA — which drops an earlier still-queued push's
            # notes for good once this run publishes and becomes the base
            # (Codex, PR #58). A skipped release costs a re-run; a wrong range
            # base loses commits from Play's record.
            if ! page_rows=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&per_page=100&page=${page}" \
              --jq '.workflow_runs[]? | [.id, .head_sha] | @tsv'); then
              echo "::error::Could not query main workflow runs (page ${page}) for the release-notes range base; refusing to publish an incomplete release record."
              exit 1
            fi
            # An empty page (a successful query past the end of history) means
            # the whole run history was walked, so a miss here really is "this
            # workflow has never published".
            if [ -z "$page_rows" ]; then
              break
            fi
            while IFS=$'\t' read -r run_id run_head; do
              [ -z "$run_id" ] && continue
              saw_run=true
              oldest_run_head="$run_head"
              # `filter=all` considers every ATTEMPT of the run, not just the
              # latest: a re-run keeps the same run id while only the attempt
              # number increments, so a re-run after an earlier attempt already
              # published would otherwise hide that publication and let this run
              # re-use its versionCode (Codex, PR #58). The current run needs no
              # special skip — its own upload step runs after this one, so its
              # in-progress attempt is never `success`; an earlier attempt of it
              # (or an earlier same-SHA workflow_dispatch) that did publish is
              # exactly what must be found, and the supersession check below then
              # stands this run down rather than picking an older base. Fail
              # closed if the jobs query itself fails, matching the outer
              # workflow-runs query — a masked failure could pick an older base
              # and repeat or re-upload notes (Codex, PR #58).
              if ! published=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100&filter=all" \
                --jq '[.jobs[]
                       | select(.name == "Distribute and release")
                       | select(.conclusion == "success")
                       | .steps[]
                       | select(.name == "Upload to Play Store internal track")
                       | .conclusion]
                      | any(. == "success")'); then
                echo "::error::Could not query jobs for run ${run_id} while finding the release-notes range base; refusing to publish an incomplete release record."
                exit 1
              fi
              if [ "$published" = "true" ]; then
                prev_sha="$run_head"
                break
              fi
            done <<< "$page_rows"
            if [ -n "$prev_sha" ]; then
              break
            fi
            page=$((page + 1))
            if [ "$page" -gt "$MAX_RUN_PAGES" ]; then
              hit_page_cap=true
              break
            fi
          done
          # per_page=100 is the API max, so the common case — the previous
          # main run published — costs two calls and stops. Paging further
          # only happens while nothing has published yet, which is also the
          # only case where the extra calls buy anything: each page costs up
          # to 100 more per-run job lookups, so this is capped rather than
          # run with --paginate over the workflow's entire history. If the
          # cap is reached with no publication found, the base below is the
          # best available (the parent of the oldest run seen) and commits
          # older than that are not recovered — a real limit, logged loudly
          # rather than papered over, and one that needs MAX_RUN_PAGES × 100
          # consecutive non-publishing main runs to reach.

          # Fallbacks, in order:
          #   1. The last run that published.
          #   2. The parent of the oldest run searched, when the query
          #      worked but *nothing* it returned published — every one of
          #      those runs built without releasing, so their commits are
          #      all still queued. BEFORE_SHA would cover only the newest
          #      push here and, once this run publishes and becomes the
          #      next base, the earlier queued subjects would be lost for
          #      good — the exact failure this step exists to prevent, just
          #      moved one rung down. The parent (not the run head itself)
          #      so the oldest unpublished commit is inside the range; a
          #      root commit has no parent, so that guard falls through.
          #   3. BEFORE_SHA when the query returned nothing at all (fresh
          #      repo with no prior main run, API hiccup) — except when
          #      it's all-zeros or unreachable (first push to a branch,
          #      force-reset orphaning the old tip).
          #   4. HEAD alone — walking the entire history would be both slow
          #      and meaningless.
          # Case 2 is bounded by the page cap, and the 50-subject cap
          # and 500-char truncation below bound the output; oldest-first is
          # preserved at the head, so the queued backlog leads the notes and
          # the tail is dropped with the usual "…". The range walk itself is
          # deliberately uncapped: `git log --max-count` limits commits
          # BEFORE `--reverse` applies (git documents --reverse as
          # reversing the commits already chosen), so a pre-walk cap would
          # keep the newest N and silently drop the oldest — the exact
          # commits the oldest-first notes must preserve. The cap lives on
          # qualifying subjects inside the filter loop below instead; the
          # per-commit diff-tree cost on a pathologically long range
          # (release outage) is the accepted trade.
          # A later push already published everything this run would ship,
          # so there is nothing left to release and uploading would only
          # re-use a versionCode Play has already taken.
          #
          # Reachable because `main` runs do not queue behind one another:
          # each keys its own concurrency group, so two can validate at once,
          # and only `deploy` serializes. Group order is arbitrary -- by when
          # each job started waiting, not by push order -- so an older push's
          # deploy can reach the upload after a newer one published a higher
          # versionCode, and Play rejects it. On this repo that failure costs
          # a billed run and reads as a broken release rather than a race.
          #
          # Checks $prev_sha, never main's raw current tip. `main` can advance
          # past this run's SHA with nothing having published -- the later
          # push may classify docs-only and skip every heavy job, or its build
          # may fail before `deploy` runs -- and skipping on that would strand
          # this run's releasable commits with nothing left to ship them. The
          # only signal that this run's work is genuinely already covered is
          # $prev_sha, the head of a run that actually published, descending
          # from $AFTER_SHA. `git cat-file -e` first because a shallow or
          # pruned clone may not hold that object, and `merge-base` on a
          # missing commit answers no rather than erroring.
          if [ -n "$prev_sha" ] \
             && git cat-file -e "$prev_sha" 2>/dev/null \
             && git merge-base --is-ancestor "$AFTER_SHA" "$prev_sha" 2>/dev/null; then
            echo "A later push already published (last published SHA ${prev_sha} already includes this run's ${AFTER_SHA}); skipping."
            echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          base_sha=""
          if [ -n "$prev_sha" ] && git cat-file -e "$prev_sha" 2>/dev/null; then
            base_sha="$prev_sha"
          elif [ "$saw_run" = true ] && [ -n "$oldest_run_head" ] \
             && git rev-parse --quiet --verify "${oldest_run_head}~1^{commit}" >/dev/null; then
            base_sha=$(git rev-parse "${oldest_run_head}~1")
            echo "No published run found; basing notes on the queued backlog from ${base_sha}."
            if [ "$hit_page_cap" = true ]; then
              echo "::warning::Searched ${MAX_RUN_PAGES} pages of main runs without finding a publication. Release notes start at ${base_sha}; anything released-worthy older than that is not included."
            fi
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git rev-parse --quiet --verify "$BEFORE_SHA^{commit}" >/dev/null; then
            base_sha="$BEFORE_SHA"
          fi

          if [ -n "$base_sha" ]; then
            shas=$(git log --reverse --no-merges --format=%H "$base_sha..$AFTER_SHA")
          else
            shas=""
          fi
          if [ -z "$shas" ]; then
            shas=$(git log -1 --format=%H "$AFTER_SHA")
          fi

          subjects=()
          # ONE bound, on the card: at most 50 DISTINCT subjects. Counting
          # commits instead lets 50 repeats eat the budget and silently drop
          # the distinct subject behind them, with the card holding one
          # bullet and nowhere near the 500-char cap.
          #
          # There is deliberately no separate bound on the walk. Repeats no
          # longer grow the array, so the budget stops bounding the loop —
          # but the range is bounded by the release cadence, each commit
          # costs one `git diff-tree`, and such a bound has to answer two
          # questions this one does not: what marks the notes truncated, and
          # what a capped scan that collected nothing means. Getting the
          # second wrong sets RELEASE_NOTES_SKIP, which never advances the
          # base, so every later push rescans the same prefix and can never
          # publish again.
          MAX_SUBJECTS=50
          truncated=false
          # Collapses a subject already collected, so two dependency
          # batches in one release window do not print the same bullet
          # twice. The FIRST occurrence is kept: the list is oldest-first
          # and every cap drops from the tail, so a repeat must never
          # displace the head or spend budget a later distinct subject
          # needs.
          # Returns non-zero only when the budget is spent AND this subject
          # would have taken a slot — so the caller stops, and `truncated`
          # means something really was cut. Checking the budget before that
          # point claims omission over a tail of duplicates and housekeeping
          # that would have added nothing, publishing a complete list with a
          # "…" on the end.
          add_subject() {
            local s="$1" i
            # Indexed rather than "${subjects[@]}": the count is always
            # safe to read under `set -u`, an empty array included.
            for (( i = 0; i < ${#subjects[@]}; i++ )); do
              if [ "${subjects[$i]}" = "$s" ]; then
                echo "Subject already collected, not repeating it: $s"
                return 0
              fi
            done
            if [ "${#subjects[@]}" -ge "$MAX_SUBJECTS" ]; then
              echo "Reached $MAX_SUBJECTS distinct subjects; ignoring the rest of the range."
              truncated=true
              return 1
            fi
            subjects+=("$s")
          }

          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            s=$(git log -1 --format=%s "$sha")
            case "$s" in
              ci:*)       continue ;;
              docs:*)     continue ;;
              internal:*) continue ;;
              refactor:*) continue ;;
              test:*)     continue ;;
              tests:*)    continue ;;
            esac
            relevant=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # `case` matches `*` against `/` too, so `.*` covers any path
              # whose first component starts with `.` (.github/, .claude/,
              # .gitignore, …) in one pattern.
              case "$f" in
                .*)    ;;
                *.md)  ;;
                *)     relevant=true; break ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$sha")
            if [ "$relevant" = "false" ]; then
              continue
            fi
            add_subject "$s" || break
          done <<< "$shas"

          if [ "${#subjects[@]}" -eq 0 ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "No release-worthy commits, but this is a manual workflow_dispatch — publishing the current tip anyway with a generic note."
              subjects+=("Internal test build")
            else
              echo "No release-worthy commits queued for release; skipping the GitHub release and the Play upload."
              echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          MAX=500
          TRUNC_MARK=$'\n…'

          # `wc -m` counts characters under a UTF-8 locale; pin it so the
          # bullet ("• ") and the ellipsis are scored as Play sees them,
          # not as raw bytes.
          export LC_ALL=C.UTF-8

          format_notes() {
            local first=1
            for s in "$@"; do
              if [ "$first" -eq 1 ]; then
                printf '%s' "• $s"
                first=0
              else
                printf '\n• %s' "$s"
              fi
            done
          }

          char_len() {
            printf '%s' "$1" | wc -m
          }

          # Two-phase: greedy-add subjects until the formatted output would
          # exceed MAX, then, if anything was dropped, append the "\n…"
          # marker — dropping further subjects if the marker itself
          # overflows. A single 499-500-char subject is hard-truncated.
          kept=()
          for s in "${subjects[@]}"; do
            candidate=$(format_notes "${kept[@]}" "$s")
            if [ "$(char_len "$candidate")" -gt "$MAX" ]; then
              truncated=true
              break
            fi
            kept+=("$s")
          done

          if [ "${#kept[@]}" -eq 0 ]; then
            notes=$(printf '%s' "• ${subjects[0]}" | cut -c 1-499)
            notes="${notes}…"
          else
            notes=$(format_notes "${kept[@]}")
            if [ "$truncated" = true ]; then
              while [ "$(char_len "${notes}${TRUNC_MARK}")" -gt "$MAX" ] \
                && [ "${#kept[@]}" -gt 0 ]; do
                unset 'kept[${#kept[@]}-1]'
                notes=$(format_notes "${kept[@]}")
              done
              if [ "${#kept[@]}" -eq 0 ]; then
                notes=$(printf '%s' "• ${subjects[0]}" | cut -c 1-498)
              fi
              notes="${notes}${TRUNC_MARK}"
            fi
          fi

          # Random heredoc terminator so a crafted commit subject can't
          # include the literal terminator and inject entries into
          # $GITHUB_ENV.
          delim="RELEASE_NOTES_EOF_$(openssl rand -hex 16)"
          {
            printf 'RELEASE_NOTES<<%s\n' "$delim"
            printf '%s\n' "$notes"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"

      - name: Download the release AAB
        # Built by `release-build`, in parallel with the tests rather than after
        # them. Restored to the path Gradle would have written it to, so the
        # publish step's `releaseFiles` is unchanged.
        if: needs.release-build.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release

      - name: Publish a GitHub release
        # Makes the signed bundle durable and the push's outcome legible.
        # The run's own artifact expires and is reachable only from that
        # run's page, which is what makes "did this push ship?" unanswerable
        # from the Actions list: a run is titled by its last commit, so a
        # push tipped with a housekeeping commit reads as housekeeping even
        # when it built, signed and published. A release is permanent,
        # linkable, listed on a page of its own, and `gh release download`
        # works against it. Nobody installs an AAB — this is a record of
        # what shipped and the copy a maintainer hands to Play Console, not
        # a second distribution channel.
        #
        # Play's own upload needs everything this needs and the service
        # account besides, so the invariant is one-way: every Play upload is
        # preceded by a release, never the reverse, and a repository holding
        # only the upload keystore still gets a discoverable build. Ahead of
        # the upload deliberately — a rejection is exactly when having the
        # bundle to hand matters.
        #
        # Prerelease because nothing in this pipeline promotes a build past
        # Play's internal track.
        #
        # Supersession is the script's own check, not this `if:`. Nothing
        # here reaches Play, so nothing rejects a stale bundle the way
        # Play's API does, and the Releases page orders by publication time
        # — so an older push whose deploy runs late would sit on top reading
        # as current. It asks the release list, which is the record of what
        # published; folding it into "Build release notes"' probe instead
        # would be wrong, because that probe keys on a successful *Play*
        # upload precisely because it doubles as the notes' range base.
        #
        # When it finds itself superseded the script sets RELEASE_SUPERSEDED,
        # and the Play steps below skip on it too: stopping at this step would
        # leave the older bundle going to Play whenever the newer run's own
        # upload skipped or failed — which is precisely the case where a
        # newer prerelease exists and no newer Play release does. This step's
        # own condition is a superset of theirs, so whenever they run it has
        # run and the variable is set.
        #
        # The body lives in `scripts/publish-github-release.sh`, which
        # `scripts/publish_github_release_test.py` drives against a stubbed
        # `gh` on every pull request. This job cannot run on one, so an
        # inline body could only ever be verified by merging it. Nothing in
        # that script is app-specific: the bundle path and asset base name
        # come in here, so the file stays byte-identical across the siblings
        # that publish this way.
        if: |
          needs.release-build.outputs.signed == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          AAB_PATH: app/build/outputs/bundle/release/app-release.aab
          ASSET_BASE: stopdash
        run: scripts/publish-github-release.sh

      - name: Compose Play Store release notes
        # The upload action takes a directory of whatsnew-<locale> files;
        # this writes the list built by "Build release notes" in the layout
        # the action expects.
        if: |
          needs.release-build.outputs.signed == 'true' &&
          env.HAS_PLAY_SA == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true' &&
          env.RELEASE_SUPERSEDED != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/whatsnew"
          printf '%s' "${RELEASE_NOTES}" \
            > "${RUNNER_TEMP}/whatsnew/whatsnew-en-US"
          echo "PLAY_WHATSNEW_DIR=${RUNNER_TEMP}/whatsnew" >> "${GITHUB_ENV}"

      - name: Upload to Play Store internal track
        # Runs only with both the upload key and service account configured,
        # and skipped when RELEASE_NOTES_SKIP=true — no Play-worthy "What's
        # new" entry exists, so shipping would be redundant. Skipped too on
        # RELEASE_SUPERSEDED, set by the release step above when a later
        # push has already published a higher versionCode: Play accepts an
        # older bundle whenever the newer run's own upload skipped or
        # failed, so standing down there has to stand this down as well. See
        # dev-docs/play-store-internal-track.md for the Play Console setup.
        if: |
          needs.release-build.outputs.signed == 'true' &&
          env.HAS_PLAY_SA == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true' &&
          env.RELEASE_SUPERSEDED != 'true'
        uses: r0adkll/upload-google-play@a80b0bcdcfdfcc2d026f2bc73f726760b2cbc967  # post-v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.stopdash
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ env.PLAY_WHATSNEW_DIR }}

