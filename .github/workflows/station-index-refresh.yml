name: station-index-refresh

# Rebuilds the bundled station list (app/src/main/assets/stations/station_index.json) from TfL,
# the National Rail station codes (crs_codes.json) from NaPTAN, and the step-free access table
# (step_free.json) from TfL's station data, and the stops the near-me list finds on the device
# (stops.tsv) from TfL's stop lists, once a week and, when any changed, opens (or updates) a
# pull request with them that merges itself once its checks pass, so "Find a station", National Rail times and step-free marks keep up
# without anyone touching the builders. station-index.yml still rebuilds them on a pull request
# that changes a builder; this is the scheduled refresh.
#
# Split like the others: the build job fetches from TfL and runs the builder with a read-only
# token; the publish job runs nothing from TfL or any pull request — it only commits the built
# file and opens the pull request. It uses the weekly dependency batch's GRADLE_UPDATE_PAT from
# the `gradle-update` environment (Contents and Pull requests: read and write, this repository
# only), because a pull request opened or pushed with the default token starts no CI on it.
# Borrowed for now; TODO.md tracks moving both to one shared UPDATE_PAT.
#
# Cost and reliability (AGENTS.md): 0 pounds — about 60 keyless TfL requests, one ~30 MB NaPTAN
# download, one ~200 KB TfL station data download, and a couple of minutes of Actions time a week;
# nothing the app sends, so no Play Data Safety or battery change.
# If TfL or NaPTAN is down or answers short (a missing mode, a missing interchange, under 200
# stations, under 2,000 station codes, under 300 step-free stops or a line missing from them, under
# 15,000 bus stops or most of them without their routes), the
# builder refuses to write, this scheduled run fails — GitHub emails the owner — and the committed
# files stay as they were. Unchanged files open nothing.
on:
  schedule:
    - cron: '43 5 * * 0'   # Sundays, off the top of the hour and a day after the dependency batch
  workflow_dispatch:
permissions: {}
concurrency:
  group: station-index-refresh
  cancel-in-progress: false
env:
  INDEX: app/src/main/assets/stations/station_index.json
  CRS: app/src/main/assets/stations/crs_codes.json
  STEP_FREE: app/src/main/assets/stations/step_free.json
  STOPS: app/src/main/assets/stations/stops.tsv
  KEPT: app/src/main/assets/stations/stops_kept.tsv
  BRANCH: station-index/refresh
jobs:
  build:
    name: build station index
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.base.outputs.sha }}
      tip: ${{ steps.base.outputs.tip }}
    steps:
      # main, whatever ref a manual run was started from: the refresh is proposed against main.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      # The exact commit the list is built from, so the publish job commits onto that same one even
      # if main moves in between; and the refresh branch's tip as the run starts (blank if it
      # doesn't exist), which the publish job's push leases on, so anything pushed there during the
      # run makes the push fail rather than be overwritten.
      - name: Record the base commit and the refresh branch's tip
        id: base
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tip=$(git ls-remote "$REPO_URL" "refs/heads/$BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Test the index builder
        run: python3 scripts/build_station_index_test.py
      - name: Test the station code builder
        run: python3 scripts/build_crs_index_test.py
      - name: Test the step-free builder
        run: python3 scripts/build_step_free_test.py
      - name: Test the stop list builder
        run: python3 scripts/build_stops_test.py
      - name: Test the station model's stop membership
        run: python3 scripts/stop_membership_test.py
      # The committed membership, kept to list what this refresh regroups.
      - name: Keep the committed lists
        run: |
          mkdir -p build/old
          cp "$INDEX" build/old/station_index.json
          cp "$STOPS" build/old/stops.tsv
      - name: Build the index from TfL
        run: python3 scripts/build_station_index.py --out "$INDEX"
      - name: Build the National Rail station codes from NaPTAN
        run: python3 scripts/build_crs_index.py --stations "$INDEX" --out "$CRS"
      - name: Build step-free access from TfL's station data
        run: python3 scripts/build_step_free.py --out "$STEP_FREE"
      - name: Build the stop list from TfL
        # Keeps what main's list has and this read misses, for a while (KEEP_DAYS), and records
        # since when in $KEPT; read before the list is overwritten in place. main is the last
        # build because the refresh merges itself (below): a refresh left open would be rebuilt
        # from main, and what it had dropped or dated would come back with a fresh date.
        run: python3 scripts/build_stops.py --out "$STOPS" --stations "$INDEX" --previous "$(dirname "$STOPS")"
      - name: Compare with the committed lists
        id: diff
        run: |
          # status, not diff: $KEPT is new on the first run, and diff ignores an untracked file.
          if [ -z "$(git status --porcelain -- "$INDEX" "$CRS" "$STEP_FREE" "$STOPS" "$KEPT")" ]; then
            echo "The files are unchanged; nothing to open."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --short -- "$INDEX" "$CRS" "$STEP_FREE" "$STOPS" "$KEPT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Every id whose station, stop, owning station or hub changed, for the pull request's body.
      - name: List the membership changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 scripts/membership_changes.py --old-stops build/old/stops.tsv --old-index build/old/station_index.json \
            --new-stops "$STOPS" --new-index "$INDEX" > build/membership.md
          cat build/membership.md
      - name: Upload the lists
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: station-index
          path: |
            ${{ env.INDEX }}
            ${{ env.CRS }}
            ${{ env.STEP_FREE }}
            ${{ env.STOPS }}
            ${{ env.KEPT }}
          if-no-files-found: error
      # Its own artifact: in the lists' one, its path would move theirs off the shared directory.
      - name: Upload the membership changes
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: membership-changes
          path: build/membership.md
          if-no-files-found: error

  publish:
    name: open the refresh pull request
    needs: [build]
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: gradle-update
    permissions:
      contents: read
    steps:
      # The commit the build job built from, not whatever main is now.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - name: Download the index
        uses: actions/download-artifact@v4
        with:
          name: station-index
          path: build/station-index
      - name: Download the membership changes
        uses: actions/download-artifact@v4
        with:
          name: membership-changes
          path: build/membership
      - name: Commit it to the refresh branch
        env:
          TOKEN: ${{ secrets.GRADLE_UPDATE_PAT }}
          REPO: ${{ github.repository }}
          TIP: ${{ needs.build.outputs.tip }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GRADLE_UPDATE_PAT is not set in the gradle-update environment."
            exit 1
          fi
          cp build/station-index/station_index.json "$INDEX"
          cp build/station-index/crs_codes.json "$CRS"
          cp build/station-index/step_free.json "$STEP_FREE"
          cp build/station-index/stops.tsv "$STOPS"
          cp build/station-index/stops_kept.tsv "$KEPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- "$INDEX" "$CRS" "$STEP_FREE" "$STOPS" "$KEPT"
          git commit -m "Refresh station details from TfL"
          # The branch is this workflow's own: each week's list replaces the last one's. Leased on
          # the tip the build job saw as the run started (or on its absence), so a change someone
          # else pushed there since fails this run rather than being overwritten.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push --force-with-lease="refs/heads/$BRANCH:$TIP" "https://github.com/$REPO.git" "HEAD:refs/heads/$BRANCH"
      - name: Open the pull request, or update the open one's body
        env:
          GH_TOKEN: ${{ secrets.GRADLE_UPDATE_PAT }}
        run: |
          {
            echo "The weekly rebuild of the bundled station data (station-index-refresh.yml) found changes. Review the diffs of \`$INDEX\`, \`$CRS\`, \`$STEP_FREE\` and \`$STOPS\` for anything odd (a mode, interchange, station code, step-free station or bus stop gone missing, or a station's step-free level dropping); it merges itself once its checks pass, so disable auto-merge to hold it. the builders already refuse a list under 200 stations, one missing a required mode or interchange, under 2,000 station codes, under 300 step-free stops, or under 15,000 bus stops."
            echo
            # Every id the station model regrouped (dev-docs/station-model.md), capped per category.
            cat build/membership/membership.md
          } > build/body.md
          # This repository's own branch only: a fork's same-named branch isn't the refresh.
          open=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)] | .[0].number // empty')
          if [ -n "$open" ]; then
            # The push above updated its branch; its body now describes this week's list. Its
            # auto-merge is left as it is: still armed unless someone turned it off to hold it.
            gh pr edit "$open" --body-file build/body.md
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Refresh station details from TfL" \
            --body-file build/body.md
          # It merges itself once its required checks pass (codex included), so each week's
          # refresh builds on the last one's (the stop list's --previous is main). A red check
          # holds it, visibly, for a person to look at; the next week's run replaces its head.
          gh pr merge "$BRANCH" --auto --rebase
