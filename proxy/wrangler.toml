# stopdash's National Rail relay (dev-docs/national-rail-proxy.md). Deployed by hand from this directory:
# `npx wrangler@4 deploy` (see README.md).
name = "stopdash-rail"
main = "src/index.js"
compatibility_date = "2026-10-01"

# One address, the maintainer's own (dev-docs/national-rail-proxy.md *Domain*). Set `pattern` to it.
workers_dev = false
routes = [{ pattern = "REPLACE_WITH_RELAY_HOSTNAME", custom_domain = true }]

# No request logs: Workers Logs and its traces stay off, so nothing about a caller is recorded. The cron
# job's last failure (type and stack frames) is kept in KV instead and shown by /v1/health.
[observability]
enabled = false

[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "RAIL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Cold board requests only (those reaching National Rail): per caller, under a key the IP can't be
# recovered from (src/index.js callerKey), and the relay's own budget across every caller, set under
# the Live Departure Board product's quota. Cloudflare counts each per location, so the budget bounds
# each data center, not the relay as a whole: size it at about half the quota while London's riders
# land on one or two, and move to a Durable Object if that stops holding (dev-docs/national-rail-proxy.md).
[[ratelimits]]
name = "COLD_PER_CALLER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "UPSTREAM_BUDGET"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Secrets, set with `npx wrangler@4 secret put DISRUPTIONS_API_KEY` and `… LDB_API_KEY`, never
# written here.
